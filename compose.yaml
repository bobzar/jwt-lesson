services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jwt_lesson
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before starting Docker Compose}"
    ports:
      - "5432:5432"
    volumes:
      - jwt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwt_lesson"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jwt_pgdata:
